name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version (e.g. v0.4.42). Leave empty to use VERSION."
        required: false
        type: string

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version || '' }}" ]]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "${ver}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version '${ver}'; expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

  build-packages:
    needs: compute-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: ./scripts/build/linux.sh
            pkg_ext: tar.gz
            flavor: int
            experimental: false
          - os: ubuntu-latest
            script: ./scripts/build/linux.sh
            pkg_ext: tar.gz
            flavor: llvm
            experimental: false
          - os: macos-latest
            script: ./scripts/build/macos.sh
            pkg_ext: tar.gz
            flavor: int
            experimental: true
          - os: macos-latest
            script: ./scripts/build/macos.sh
            pkg_ext: tar.gz
            flavor: llvm
            experimental: true
          - os: windows-latest
            script: ./scripts/build/windows.sh
            pkg_ext: zip
            flavor: int
            experimental: true
          - os: windows-latest
            script: ./scripts/build/windows.sh
            pkg_ext: zip
            flavor: llvm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup macOS deps
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install libffi pkg-config
          if [[ "${{ matrix.flavor }}" == "llvm" ]]; then
            brew install llvm@18
            echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"
          fi

      - name: Setup Linux deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
          if [[ "${{ matrix.flavor }}" == "llvm" ]]; then
            sudo apt-get install -y llvm-18-dev
            echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "$GITHUB_ENV"
          fi

      - name: Restore Windows LLVM binary cache
        id: windows-llvm-cache
        if: runner.os == 'Windows' && matrix.flavor == 'llvm'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: windows-vcpkg-llvm-${{ hashFiles('cmake/platform/vcpkg/windows-llvm/**', 'cmake/platform/triplets/x64-windows-static-release.cmake') }}

      - name: Require seeded Windows LLVM cache
        if: runner.os == 'Windows' && matrix.flavor == 'llvm' && steps.windows-llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw "Windows LLVM cache is missing; run the Windows LLVM Cache workflow first"

      - name: Restore Windows interpreter binary cache
        id: windows-int-cache
        if: runner.os == 'Windows' && matrix.flavor == 'int'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: windows-vcpkg-int-${{ hashFiles('cmake/platform/vcpkg/windows-int/**', 'cmake/platform/triplets/x64-windows-static-release.cmake') }}

      - name: Setup Windows vcpkg dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-bincache"
          if (Test-Path Env:VCPKG_ROOT) { Remove-Item Env:VCPKG_ROOT }
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          # Pinned baseline provides LLVM 18.1.6 and reproducible libffi ports.
          git -C $vcpkgRoot checkout f4a2b74e2c6e4e419a3d26c41b5fd6e64a711de9
          & "$vcpkgRoot/bootstrap-vcpkg.bat"
          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_FORCE_SYSTEM_BINARIES = "1"
          $env:VCPKG_DEFAULT_BINARY_CACHE = $binaryCache
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          $triplet = "x64-windows-static-release"
          $env:VCPKG_OVERLAY_TRIPLETS = Join-Path $env:GITHUB_WORKSPACE "cmake/platform/triplets"
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE "cmake/platform/vcpkg/windows-${{ matrix.flavor }}"
          $installRoot = Join-Path $vcpkgRoot "installed"
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & "$vcpkgRoot/vcpkg.exe" install `
              --x-manifest-root=$manifestRoot `
              --x-install-root=$installRoot `
              --triplet=$triplet
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Write-Host "vcpkg install failed (attempt $attempt/$maxAttempts), retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ("${{ matrix.flavor }}" -eq "llvm") {
            $llvmDir = Join-Path $vcpkgRoot "installed/x64-windows-static-release/share/llvm"
            if (-not (Test-Path (Join-Path $llvmDir "LLVMConfig.cmake"))) {
              throw "vcpkg LLVM CMake package not found at $llvmDir"
            }
            "LLVM_DIR=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Save Windows interpreter binary cache
        if: runner.os == 'Windows' && matrix.flavor == 'int' && steps.windows-int-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: windows-vcpkg-int-${{ hashFiles('cmake/platform/vcpkg/windows-int/**', 'cmake/platform/triplets/x64-windows-static-release.cmake') }}

      - name: Build + test + package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          chmod +x ./scripts/build/linux.sh ./scripts/build/macos.sh ./scripts/build/windows.sh
          cmake_args=()
          if [[ "${{ matrix.flavor }}" == "llvm" ]]; then
            cmake_args+=(--cmake-arg "-DSIMPLEVM_ENABLE_LLVM_JIT=ON")
            if [[ -n "${LLVM_DIR:-}" ]]; then
              cmake_args+=(--cmake-arg "-DLLVM_DIR=${LLVM_DIR}")
            fi
          fi
          ${{ matrix.script }} --version "${VERSION}" --tests --skip-install "${cmake_args[@]}" \
            2>&1 | tee "build-${{ runner.os }}-${{ matrix.flavor }}.log"
          if [[ "${{ matrix.flavor }}" == "llvm" ]]; then
            grep -q '^SIMPLEVM_ENABLE_LLVM_JIT:BOOL=ON$' build/CMakeCache.txt
          fi
          pkg="$(find dist -maxdepth 1 -type f -name "simple-${VERSION}-*.${{ matrix.pkg_ext }}" -print -quit)"
          test -n "$pkg"
          mv "$pkg" "${pkg%.${{ matrix.pkg_ext }}}-${{ matrix.flavor }}.${{ matrix.pkg_ext }}"

      - name: Build + package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          VCPKG_INSTALLATION_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
        run: |
          chmod +x ./scripts/build/linux.sh ./scripts/build/macos.sh ./scripts/build/windows.sh
          cmake_args=(
            --cmake-arg "-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
            --cmake-arg "-DVCPKG_TARGET_TRIPLET=x64-windows-static-release"
            --cmake-arg "-DVCPKG_OVERLAY_TRIPLETS=${GITHUB_WORKSPACE}/cmake/platform/triplets"
          )
          if [[ "${{ matrix.flavor }}" == "llvm" ]]; then
            cmake_args+=(--cmake-arg "-DSIMPLEVM_ENABLE_LLVM_JIT=ON")
            cmake_args+=(--cmake-arg "-DLLVM_DIR=${LLVM_DIR}")
          fi
          ./scripts/build/windows.sh \
            --version "${VERSION}" \
            --tests \
            --skip-install \
            "${cmake_args[@]}" \
            2>&1 | tee "build-${{ runner.os }}-${{ matrix.flavor }}.log"
          if [[ "${{ matrix.flavor }}" == "llvm" ]]; then
            grep -q '^SIMPLEVM_ENABLE_LLVM_JIT:BOOL=ON$' build/CMakeCache.txt
          fi
          pkg="$(find dist -maxdepth 1 -type f -name "simple-${VERSION}-*.zip" -print -quit)"
          test -n "$pkg"
          mv "$pkg" "${pkg%.zip}-${{ matrix.flavor }}.zip"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ runner.os }}-${{ matrix.flavor }}
          path: |
            build-*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore

      - name: Upload platform package artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}-${{ matrix.flavor }}
          path: dist/simple-${{ needs.compute-version.outputs.version }}-*.${{ matrix.pkg_ext }}
          if-no-files-found: error

  publish-release:
    needs:
      - compute-version
      - build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifact layout
        shell: bash
        run: |
          find dist -type f -name 'simple-*' -exec cp {} dist/ \;

      - name: Create latest aliases + checksums
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in dist/simple-"${VERSION}"-*.tar.gz dist/simple-"${VERSION}"-*.zip; do
            file="$(basename "$pkg")"
            if [[ "$file" == *.tar.gz ]]; then
              target="${file#simple-${VERSION}-}"
              target="${target%.tar.gz}"
              latest="dist/simple-latest-${target}.tar.gz"
            elif [[ "$file" == *.zip ]]; then
              target="${file#simple-${VERSION}-}"
              target="${target%.zip}"
              latest="dist/simple-latest-${target}.zip"
            else
              continue
            fi
            cp "$pkg" "$latest"
            sha256sum "$pkg" > "${pkg}.sha256"
            sha256sum "$latest" > "${latest}.sha256"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Release artifacts for Linux, macOS, and Windows are attached below.
          files: |
            dist/simple-${{ needs.compute-version.outputs.version }}-*.tar.gz
            dist/simple-${{ needs.compute-version.outputs.version }}-*.tar.gz.sha256
            dist/simple-${{ needs.compute-version.outputs.version }}-*.zip
            dist/simple-${{ needs.compute-version.outputs.version }}-*.zip.sha256
            dist/simple-latest-*.tar.gz
            dist/simple-latest-*.tar.gz.sha256
            dist/simple-latest-*.zip
            dist/simple-latest-*.zip.sha256
